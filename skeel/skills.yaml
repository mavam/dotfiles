# Desired global skill state for skeel.
# Installed by `skeel apply`; updated by `skeel update`.

agents:
  - universal
  - claude-code

sources:
  - source: anthropics/skills
    skills:
      - frontend-design
      - skill-creator
  - source: cloudflare/skills
    skills:
      - wrangler
  - source: mattpocock/skills
    skills:
      - caveman
      - grill-me
      - improve-codebase-architecture
      - teach
  - source: mavam/quarto-brief
    skills:
      - quarto-brief
  - source: max-sixty/worktrunk
    skills:
      - worktrunk
  - source: openclaw/gogcli
    allow_hidden_dirs: true
    skills:
      - gog
  - source: schpet/linear-cli
    skills:
      - linear-cli
  - source: shadcn/ui
    skills:
      - shadcn
  - source: tenzir/skills
    skills:
      - tenzir-asim
      - tenzir-cim
      - tenzir-ecs
      - tenzir-ocsf
      - tenzir-udm
      - tenzir-commit-changes
      - tenzir-create-pull-requests
      - tenzir-design-system
      - tenzir-docs
      - tenzir-manage-packages
      - tenzir-review-changes
      - tenzir-ship
      - tenzir-technical-writing
      - tenzir-update-docs
  - source: mavam/skills
    private: true
    skills:
      - mavam
  - source: downstairs-dawgs/clacks
    skills:
      - clacks
    install:
      - uvx --from slack-clacks clacks skill --mode universal
      - uvx --from slack-clacks clacks skill --mode claude

# Skipped for now: markit (root-level SKILL.md; gh skill cannot discover it yet).

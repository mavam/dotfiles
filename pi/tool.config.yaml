entries:
  - source: "agent/settings.json"
    target: "~/.pi/agent/settings.json"
  - source: "agent/models.json"
    target: "~/.pi/agent/models.json"
  - source: "agent/keybindings.json"
    target: "~/.pi/agent/keybindings.json"
  - source: "agent/themes"
    target: "~/.pi/agent/themes"
  - source: "agent/extensions/thinking-level-shortcuts.ts"
    target: "~/.pi/agent/extensions/thinking-level-shortcuts.ts"
  - source: "agent/extensions/settings-persistence.ts"
    target: "~/.pi/agent/extensions/settings-persistence.ts"
  - source: "agent/extensions/pr-watch.ts"
    target: "~/.pi/agent/extensions/pr-watch.ts"
  - source: "agent/extensions/package.json"
    target: "~/.pi/agent/extensions/package.json"
  - source: "agent/extensions/package-lock.json"
    target: "~/.pi/agent/extensions/package-lock.json"
  - source: "agent/fancy-footer.json"
    target: "~/.pi/agent/fancy-footer.json"

post_install:
  - 'if command -v npm >/dev/null 2>&1; then npm ci --omit=dev --prefix "$PREFIX/.pi/agent/extensions" >/dev/null; else log_warn "npm not found; skipping Pi extension dependencies. Install Node.js, then rerun ./dots install pi"; fi'
